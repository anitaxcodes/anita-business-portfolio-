  <line x1="20" y1="84" x2="68" y2="84" stroke="#12153D" stroke-width="4" stroke-linecap="round"/>

  <!-- Pencil group — slate blue, angled -->
  <!-- Pencil body -->
  <rect x="76" y="34" width="13" height="44" rx="2" fill="#4F5B8E" transform="rotate(12 82 56)"/>
  <!-- Pencil tip -->
